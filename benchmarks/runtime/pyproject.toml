[project]
name = "noisy-asr-search"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "absl-py==2.5.0",
    "diffusers==0.39.0",
    "jiwer==4.0.0",
    "librosa==1.0.0",
    "ml-collections==1.1.0",
    "peft==0.21.2",
    "pyarrow==25.0.1",
    "qwen-asr==0.0.6",
    "scipy==1.18.1",
    "silero-vad==6.2.3",
    "soundfile==0.14.0",
    "torch==2.10.0",
    "torchaudio==2.10.0",
    "torchvision==0.25.0",
    "whisper-normalizer==0.1.15",
]

[tool.uv.sources]
torch = { index = "pytorch-rocm" }
torchaudio = { index = "pytorch-rocm" }
torchvision = { index = "pytorch-rocm" }

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.1"
explicit = true
