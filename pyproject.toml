[project]
name = "assistant-transcription"
version = "0.1.0"
description = "Local speech-to-text service for Assistant"
requires-python = ">=3.12"
dependencies = [
    "av==17.1.0",
    "ctranslate2==4.8.0",
    "english-variant-converter",
    "fastapi>=0.137.1",
    "faster-whisper==1.2.1",
    "huggingface-hub==0.36.2",
    "numpy==2.4.6",
    "nvidia-cublas-cu12==12.8.4.1",
    "nvidia-cudnn-cu12==9.19.0.56",
    "onnxruntime==1.27.0",
    "python-multipart>=0.0.32",
    "tokenizers==0.22.2",
    "uvicorn>=0.49.0",
]

[project.optional-dependencies]
canary = [
    "nemo-toolkit[asr]",
    "torch==2.11.0",
    "torchaudio==2.11.0",
]
parakeet = [
    "nemo-toolkit[asr]",
    "silero-vad>=6.2.1",
    "soundfile>=0.14.0",
    "torch==2.11.0",
    "torchaudio==2.11.0",
]
granite-speech = [
    "httpx>=0.28.1",
]
consensus = [
    "nemo-toolkit[asr]>=2.7.3",
    "rapidfuzz>=3.14.3",
    "silero-vad>=6.2.1",
    "soundfile>=0.14.0",
    "torch==2.11.0",
    "torchaudio==2.11.0",
]

[project.scripts]
assistant-transcription = "assistant_transcription.server:main"

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.uv.sources]
english-variant-converter = { git = "https://github.com/TrelisResearch/whisper-english-variant-converter.git" }
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
